<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#faf7f2;font-family:Arial,Helvetica,sans-serif;color:#1f1a17">

        <p style="text-align:center;margin:28px 0">

        </p>
        <p style="font-size:12px;color:#7a706a">This link expires in 1 hour. | ينتهي هذا الرابط خلال ساعة.</p>
      </td></tr>
    </table>
